name: HYP Tier1 live acquisition probe

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/hyp_tier1_live_probe.py'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install public probe dependency
        run: python -m pip install --disable-pip-version-check requests
      - name: Capture public first-party HYP issuer artifact
        run: python scripts/hyp_tier1_live_probe.py
      - name: Upload one-shot evidence
        uses: actions/upload-artifact@v4
        with:
          name: hyp-tier1-live-artifacts
          path: artifacts/hyp-tier1-live/
          retention-days: 1
          if-no-files-found: error
