name: P0 Full Live Source Qualification

on:
  push:
    branches:
      - chatgpt/qa-p0-alpha-free-render-removal-2026-09-08

permissions:
  contents: read

jobs:
  full-live-source:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Fetch exact Alpha candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          git init /tmp/alpha
          git -C /tmp/alpha remote add origin https://github.com/annachou5566/alpha-realtime-bot.git
          git -C /tmp/alpha fetch --depth=1 origin 64a26c80ffdb8941dad085d401814ec5435998e9
          git -C /tmp/alpha checkout --detach FETCH_HEAD
          test "$(git -C /tmp/alpha rev-parse HEAD)" = "64a26c80ffdb8941dad085d401814ec5435998e9"
          printf 'ALPHA_EXACT_HEAD=PASS\n'

      - name: Install exact dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          cd /tmp/alpha
          npm ci --ignore-scripts --no-audit --no-fund

      - name: Full live Binance source qualification
        shell: bash
        env:
          TAILS_QUALIFICATION_ONLY: "true"
          TAILS_QUAL_MAX_TOKENS: "0"
          TAILS_QUAL_CONCURRENCY: "2"
          TAILS_QUAL_MAX_REQUESTS: "2000"
        run: |
          set -Eeuo pipefail
          cd /tmp/alpha
          node scripts/tails-resource-qualification.js
          printf 'FULL_LIVE_SOURCE_QUALIFICATION=PASS\n'
