name: BTCO adjacent snapshot probe

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Fetch one bounded first-party BTCO snapshot
        run: python scripts/btco_adjacent_probe.py
      - name: Upload immutable public evidence
        uses: actions/upload-artifact@v4
        with:
          name: btco-adjacent-artifact
          path: artifacts/
          retention-days: 1
