name: Liquidation public preflight one-shot

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  public-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Capture bounded public runtime evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          OUT="artifacts/liquidation-public-preflight"
          mkdir -p "$OUT"
          WORKER="https://wave-alpha-liquidation-coordinator.wavealpha.workers.dev"

          capture() {
            local name="$1" url="$2" expected="$3"
            local code
            code="$(curl --silent --show-error --location --connect-timeout 8 --max-time 15 \
              -D "$OUT/${name}.headers" \
              -o "$OUT/${name}.body" \
              -w '%{http_code}' "$url")"
            printf '%s\n' "$code" > "$OUT/${name}.status"
            printf '%s status=%s expected=%s\n' "$name" "$code" "$expected"
            test "$code" = "$expected"
          }

          capture health "$WORKER/health" 200
          capture history "$WORKER/history?range=1d&symbol=ALL&exchange=ALL" 200
          capture semantic_anon "$WORKER/admin/history-semantic/status" 401
          capture pages_immutable "https://4017b33d.wave-alpha.pages.dev/" 200
          capture pages_canonical "https://wave-alpha.pages.dev/" 200
          capture etf_anon "https://wave-alpha.pages.dev/api/etf-flows" 403

          python3 -c 'import json; d=json.load(open("artifacts/liquidation-public-preflight/health.body")); assert d.get("ok") is True; assert d.get("trafficEnabled") is True; assert d.get("ingestReady") is True; assert d.get("adminReady") is True'
      - name: Upload immutable public evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: liquidation-public-preflight-2026-08-21
          path: artifacts/liquidation-public-preflight
          if-no-files-found: error
          retention-days: 2
