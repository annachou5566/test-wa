name: P0 Final Live Source QA

on:
  push:
    branches:
      - chatgpt/qa-p0-alpha-free-render-removal-2026-09-08

permissions:
  contents: read

jobs:
  final-source:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Fetch exact sources
        shell: bash
        run: |
          set -Eeuo pipefail

          git init /tmp/alpha
          git -C /tmp/alpha remote add origin https://github.com/annachou5566/alpha-realtime-bot.git
          git -C /tmp/alpha fetch --depth=1 origin 8e6973f595fec4eaf0182ea802d0ca08a39c57c6
          git -C /tmp/alpha checkout --detach FETCH_HEAD
          test "$(git -C /tmp/alpha rev-parse HEAD)" = "8e6973f595fec4eaf0182ea802d0ca08a39c57c6"
          printf 'ALPHA_EXACT_HEAD=PASS\n'

          git init /tmp/dfk
          git -C /tmp/dfk remote add origin https://github.com/annachou5566/data-fetcher-king.git
          git -C /tmp/dfk fetch --depth=1 origin d6f8fd2573fc64afd0c71d0eedd38c62b06b7f71
          git -C /tmp/dfk checkout --detach FETCH_HEAD
          test "$(git -C /tmp/dfk rev-parse HEAD)" = "d6f8fd2573fc64afd0c71d0eedd38c62b06b7f71"
          printf 'DFK_EXACT_HEAD=PASS\n'

      - name: Static and compile gates
        shell: bash
        run: |
          set -Eeuo pipefail

          cd /tmp/alpha
          node --check lib/tails-producer.js
          node --check lib/tails-cache-contract.js
          node --check scripts/tails-resource-qualification.js
          bash -n scripts/oracle-p0-tails-resource-qualification.sh
          grep -q 'rows.length < 1000' lib/tails-producer.js
          grep -q 'requestParsedKline' lib/tails-producer.js
          grep -q '/^0x\[0-9a-fA-F\]+\$/' lib/tails-producer.js
          grep -q 'newly-listed short kline page stops pagination' test/tails-producer.test.js
          grep -q 'non-EVM case-sensitive contract address is preserved' test/tails-producer.test.js
          ! grep -Eq 'limitMap\[id\][[:space:]]*\|\|[[:space:]]*0' index.js
          printf 'ALPHA_STATIC=PASS\n'

          cd /tmp/dfk
          python3 -m py_compile scripts/fetch_alpha.py
          grep -q '^import re$' scripts/fetch_alpha.py
          grep -q 'len(rows) < 1000' scripts/fetch_alpha.py
          grep -q '_fetch_tail_response_with_contract_retry' scripts/fetch_alpha.py
          grep -q 're.fullmatch(r"0x\[0-9a-fA-F\]+"'
          printf 'DFK_STATIC=PASS\n'

      - name: Install Alpha dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          cd /tmp/alpha
          npm ci --ignore-scripts --no-audit --no-fund

      - name: Run Alpha unit tests
        shell: bash
        run: |
          set -Eeuo pipefail
          cd /tmp/alpha
          npm test
          printf 'ALPHA_BACKEND_TESTS=PASS\n'

      - name: Run full live Binance source qualification
        shell: bash
        env:
          TAILS_QUALIFICATION_ONLY: "true"
          TAILS_QUAL_MAX_TOKENS: "0"
          TAILS_QUAL_CONCURRENCY: "2"
          TAILS_QUAL_MAX_REQUESTS: "2000"
        run: |
          set -Eeuo pipefail
          cd /tmp/alpha
          node scripts/tails-resource-qualification.js
          printf 'FULL_LIVE_SOURCE_QUALIFICATION=PASS\n'
