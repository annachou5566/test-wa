name: Lighter browser origin probe

on:
  push:
    paths:
      - "scripts/lighter-browser-origin-probe.mjs"
      - ".github/workflows/lighter-browser-origin-probe.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lighter-browser-origin-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Playwright
        run: npm install --no-save playwright@1.55.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Probe Lighter from Wave Alpha browser origin
        id: probe
        shell: bash
        run: |
          set +e
          node scripts/lighter-browser-origin-probe.mjs 2>&1 | tee /tmp/lighter-browser-origin-probe.txt
          rc=${PIPESTATUS[0]}
          set -e
          printf 'exitCode=%s\n' "$rc" >> /tmp/lighter-browser-origin-probe.txt
          printf 'PROBE_RC=%s\n' "$rc" >> "$GITHUB_OUTPUT"
      - name: Persist bounded probe evidence
        if: always()
        shell: bash
        run: |
          mkdir -p results
          cp /tmp/lighter-browser-origin-probe.txt results/lighter-browser-origin-probe.txt
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add results/lighter-browser-origin-probe.txt
          if ! git diff --cached --quiet; then
            git commit -m "QA evidence: Lighter browser-origin probe"
            git push
          fi
      - name: Enforce probe result
        if: always()
        shell: bash
        run: test "${{ steps.probe.outputs.PROBE_RC }}" = "0"
