name: ETF Tier1 live acquisition probe

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/etf_tier1_live_probe.py'
      - '.github/workflows/etf-tier1-live-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bounded public probe dependencies
        run: |
          python -m pip install --disable-pip-version-check requests playwright
          python -m playwright install --with-deps chromium
      - name: Capture public first-party issuer artifacts
        run: python scripts/etf_tier1_live_probe.py
      - name: Upload one-shot evidence
        uses: actions/upload-artifact@v4
        with:
          name: etf-tier1-live-artifacts
          path: artifacts/etf-tier1-live/
          retention-days: 1
          if-no-files-found: error
