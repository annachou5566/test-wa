name: Security Preview Rate Limit Recheck

on:
  push:
    paths:
      - '.github/workflows/security-preview-rate-limit-recheck.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rate-limit-recheck:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Recheck only invalidated session-mint limiter gate
        shell: bash
        run: |
          set -Eeuo pipefail
          TARGET='https://704e00e8.wave-alpha.pages.dev'
          OUT='security-preview-rate-limit-result.txt'
          UA='wave-security-rate-recheck/2'
          seen_429=0
          count_403=0
          count_other=0
          first_429=0

          for i in $(seq 1 60); do
            code="$(curl -sS --connect-timeout 10 --max-time 20 -o /tmp/wa-rate-body -w '%{http_code}' \
              -X POST -H "Origin: $TARGET" -H 'Sec-Fetch-Site: same-origin' \
              -H "User-Agent: $UA" -H 'Content-Type: application/json' \
              --data '{"token":"invalid"}' "$TARGET/api/security/session" || true)"
            if [[ "$code" == 403 ]]; then
              count_403=$((count_403+1))
            elif [[ "$code" == 429 ]]; then
              seen_429=1
              first_429="$i"
              break
            else
              count_other=$((count_other+1))
            fi
            sleep 0.5
          done

          {
            echo "target=$TARGET"
            echo "workflow_head=$GITHUB_SHA"
            echo "timestamp_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "attempts_before_stop=$((count_403 + count_other + seen_429))"
            echo "http_403=$count_403"
            echo "other=$count_other"
            echo "first_429_attempt=$first_429"
            if [[ "$seen_429" == 1 ]]; then
              echo 'SESSION_MINT_RATE_LIMIT PASS'
            else
              echo 'SESSION_MINT_RATE_LIMIT FAIL'
            fi
          } > "$OUT"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$OUT"
          git commit -m 'qa: record security preview rate limit result'
          git push

          cat "$OUT"
          [[ "$seen_429" == 1 ]]
