name: P0 Alpha Limit Capability QA

on:
  push:
    branches:
      - chatgpt/qa-p0-alpha-free-render-removal-2026-09-08

permissions:
  contents: read

jobs:
  source-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Fetch exact alpha candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          git init /tmp/alpha
          git -C /tmp/alpha remote add origin https://github.com/annachou5566/alpha-realtime-bot.git
          git -C /tmp/alpha fetch --depth=1 origin e33bd0f9097ed9ec2fb2ecfde851aa84e16aeca6
          git -C /tmp/alpha checkout --detach FETCH_HEAD
          test "$(git -C /tmp/alpha rev-parse HEAD)" = "e33bd0f9097ed9ec2fb2ecfde851aa84e16aeca6"
          printf 'EXACT_HEAD=PASS\n'

      - name: Syntax and static contract
        shell: bash
        run: |
          set -Eeuo pipefail
          cd /tmp/alpha
          node --check lib/tails-producer.js
          node --check lib/tails-cache-contract.js
          node --check scripts/tails-resource-qualification.js
          bash -n scripts/oracle-p0-tails-resource-qualification.sh
          ! grep -q 'R2_READ_ONLY_ACCESS_KEY_ID' scripts/oracle-p0-tails-resource-qualification.sh
          ! grep -q 'R2_READ_ONLY_SECRET_ACCESS_KEY' scripts/oracle-p0-tails-resource-qualification.sh
          ! grep -Eq 'limitMap\[id\][[:space:]]*\|\|[[:space:]]*0' index.js
          grep -q 'SNAPSHOT_TAIL_LIMIT_UNSUPPORTED = new Set' index.js
          grep -q 'unsupported_limit_ids' lib/tails-producer.js
          grep -q 'offline-liveness-limit' lib/tails-producer.js
          printf 'LIMIT_CAPABILITY_STATIC=PASS\n'

      - name: Install exact dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          cd /tmp/alpha
          npm ci --ignore-scripts --no-audit --no-fund

      - name: Full backend tests
        shell: bash
        run: |
          set -Eeuo pipefail
          cd /tmp/alpha
          npm test
          printf 'ALPHA_BACKEND_TESTS=PASS\n'
