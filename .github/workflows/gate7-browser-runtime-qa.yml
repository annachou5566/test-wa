name: Gate7 canonical Pages QA

on:
  push:
    branches:
      - "chatgpt/gate7-browser-runtime-qa-2026-09-05"
    paths:
      - "scripts/gate7-pages-canonical-qa.mjs"
      - ".github/workflows/gate7-browser-runtime-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gate7-browser-runtime-qa
  cancel-in-progress: true

jobs:
  gate7:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Verify canonical Pages
        run: node scripts/gate7-pages-canonical-qa.mjs
