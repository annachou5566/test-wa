name: BRRR current state one-shot

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  brrr-current-state:
    if: github.head_ref == 'qa/brrr-current-state-2026-08-21'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Capture one current first-party BRRR widget state
        run: python3 scripts/brrr_current_state_probe.py
      - name: Upload immutable evidence
        uses: actions/upload-artifact@v4
        with:
          name: brrr-current-state-2026-08-21
          path: artifacts/brrr-current-state/
          retention-days: 1
          if-no-files-found: error
