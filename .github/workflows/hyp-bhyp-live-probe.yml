name: HYP BHYP live acquisition probe

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/hyp_bhyp_live_probe.py'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Capture public first-party BHYP artifact
        run: python scripts/hyp_bhyp_live_probe.py
      - name: Upload one-shot evidence
        uses: actions/upload-artifact@v4
        with:
          name: hyp-bhyp-live-artifact
          path: artifacts/hyp-bhyp-live/
          retention-days: 1
          if-no-files-found: error
