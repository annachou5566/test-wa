name: Liquidation hardcore Preview QA

on:
  push:
    paths:
      - "scripts/liquidation-hardcore-preview-qa.mjs"
      - ".github/workflows/liquidation-hardcore-preview-qa.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: liquidation-hardcore-preview-qa
  cancel-in-progress: true

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      WA_PREVIEW_URL: https://b975c52d.wave-alpha.pages.dev/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Playwright
        run: npm install --no-save playwright@1.55.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run real-user Liquidation hardcore flow
        id: qa
        shell: bash
        run: |
          set +e
          node scripts/liquidation-hardcore-preview-qa.mjs 2>&1 | tee /tmp/liquidation-hardcore-preview-qa.txt
          rc=${PIPESTATUS[0]}
          set -e
          printf 'exitCode=%s\n' "$rc" >> /tmp/liquidation-hardcore-preview-qa.txt
          printf 'QA_RC=%s\n' "$rc" >> "$GITHUB_OUTPUT"
      - name: Persist bounded QA evidence
        if: always()
        shell: bash
        run: |
          mkdir -p results
          cp /tmp/liquidation-hardcore-preview-qa.txt results/liquidation-hardcore-preview-qa.txt
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add results/liquidation-hardcore-preview-qa.txt
          if ! git diff --cached --quiet; then
            git commit -m "QA evidence: Liquidation hardcore Preview"
            git push
          fi
      - name: Enforce hardcore QA result
        if: always()
        shell: bash
        run: test "${{ steps.qa.outputs.QA_RC }}" = "0"