name: ASXN Stage2 source-only soak

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/asxn_stage2_soak.py"
      - ".github/workflows/asxn-stage2-soak.yml"
  push:
    branches: [main]
    paths:
      - "scripts/asxn_stage2_soak.py"
      - ".github/workflows/asxn-stage2-soak.yml"
  schedule:
    - cron: "15 3,7,11,15,19,23 * * *"

permissions:
  contents: read

concurrency:
  group: asxn-stage2-source-only-soak
  cancel-in-progress: false

jobs:
  soak:
    runs-on: ubuntu-latest
    timeout-minutes: 270
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install bounded probe dependencies
        run: python -m pip install --disable-pip-version-check requests playwright psutil

      - name: Restore ephemeral soak state
        if: github.event_name != 'pull_request'
        uses: actions/cache/restore@v4
        with:
          path: .asxn-stage2
          key: asxn-stage2-${{ github.run_id }}
          restore-keys: |
            asxn-stage2-

      - name: PR bounded preflight
        if: github.event_name == 'pull_request'
        run: >-
          python scripts/asxn_stage2_soak.py
          --duration-seconds 120
          --state-path /tmp/asxn-stage2-preflight-state.json
          --output artifacts/asxn-stage2/summary.json

      - name: Run bounded source-only soak segment
        if: github.event_name != 'pull_request'
        run: >-
          python scripts/asxn_stage2_soak.py
          --duration-seconds 15600
          --state-path .asxn-stage2/state.json
          --output artifacts/asxn-stage2/summary.json

      - name: Save ephemeral soak state
        if: always() && github.event_name != 'pull_request' && hashFiles('.asxn-stage2/state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: .asxn-stage2
          key: asxn-stage2-${{ github.run_id }}

      - name: Upload sanitized Stage2 evidence
        if: always() && hashFiles('artifacts/asxn-stage2/summary.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: asxn-stage2-${{ github.run_id }}
          path: artifacts/asxn-stage2/summary.json
          retention-days: 3
          if-no-files-found: error
