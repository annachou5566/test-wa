name: P0 Kline Contract Retry QA

on:
  push:
    branches:
      - chatgpt/qa-p0-alpha-free-render-removal-2026-09-08

permissions:
  contents: read

jobs:
  source-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Fetch exact sources
        shell: bash
        run: |
          set -Eeuo pipefail

          git init /tmp/alpha
          git -C /tmp/alpha remote add origin https://github.com/annachou5566/alpha-realtime-bot.git
          git -C /tmp/alpha fetch --depth=1 origin 08632d45495f2785d886d6c4f63dd6100e74e2ff
          git -C /tmp/alpha checkout --detach FETCH_HEAD
          test "$(git -C /tmp/alpha rev-parse HEAD)" = "08632d45495f2785d886d6c4f63dd6100e74e2ff"
          printf 'ALPHA_EXACT_HEAD=PASS\n'

          git init /tmp/dfk
          git -C /tmp/dfk remote add origin https://github.com/annachou5566/data-fetcher-king.git
          git -C /tmp/dfk fetch --depth=1 origin ab0801f6b07f1bce128c33237fdb9c1edfd13180
          git -C /tmp/dfk checkout --detach FETCH_HEAD
          test "$(git -C /tmp/dfk rev-parse HEAD)" = "ab0801f6b07f1bce128c33237fdb9c1edfd13180"
          printf 'DFK_EXACT_HEAD=PASS\n'

      - name: Static gates
        shell: bash
        run: |
          set -Eeuo pipefail

          cd /tmp/alpha
          node --check lib/tails-producer.js
          node --check scripts/tails-resource-qualification.js
          bash -n scripts/oracle-p0-tails-resource-qualification.sh
          grep -q 'requestParsedKline' lib/tails-producer.js
          grep -q 'contractRetries' lib/tails-producer.js
          grep -q 'httpContractRetries' scripts/tails-resource-qualification.js
          grep -q "code === '-5095'" lib/tails-producer.js
          ! grep -Eq 'limitMap\[id\][[:space:]]*\|\|[[:space:]]*0' index.js
          printf 'ALPHA_CONTRACT_RETRY_STATIC=PASS\n'

          cd /tmp/dfk
          python3 -m py_compile scripts/fetch_alpha.py
          grep -q '_fetch_tail_response_with_contract_retry' scripts/fetch_alpha.py
          grep -q 'attempts=2' scripts/fetch_alpha.py
          grep -q 'Tail kline contract invalid:' scripts/fetch_alpha.py
          grep -q 'Tail business code' scripts/fetch_alpha.py
          printf 'DFK_CONTRACT_RETRY_STATIC=PASS\n'

      - name: Install alpha dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          cd /tmp/alpha
          npm ci --ignore-scripts --no-audit --no-fund

      - name: Run alpha tests
        shell: bash
        run: |
          set -Eeuo pipefail
          cd /tmp/alpha
          npm test
          printf 'ALPHA_BACKEND_TESTS=PASS\n'
