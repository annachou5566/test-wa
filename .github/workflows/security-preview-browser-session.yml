name: Security Preview Browser Session Probe

on:
  push:
    paths:
      - '.github/workflows/security-preview-browser-session.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  browser-session-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install browser runtime
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Run valid-session probe
        id: probe
        continue-on-error: true
        shell: bash
        run: |
          cat > browser-probe.mjs <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const TARGET = 'https://704e00e8.wave-alpha.pages.dev';
          const OUT = 'security-preview-browser-result.txt';
          const rows = [];
          let failures = 0;
          let browser;

          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
          function record(name, status, detail = '') {
            rows.push(`${name.padEnd(34)} ${status.padEnd(10)} ${detail}`);
            if (status === 'FAIL') failures += 1;
          }
          async function direct(path, ua, cookie = '', init = {}) {
            const headers = {
              Origin: TARGET,
              'Sec-Fetch-Site': 'same-origin',
              'User-Agent': ua,
              ...(init.headers || {}),
            };
            if (cookie) headers.Cookie = `__Host-wa_session=${cookie}`;
            const response = await fetch(`${TARGET}${path}`, { ...init, headers });
            return { status: response.status, text: await response.text() };
          }
          async function rateLoop(path, ua, cookie, expected, max, delayMs) {
            let before = 0;
            let other = 0;
            for (let i = 1; i <= max; i += 1) {
              const r = await direct(path, ua, cookie);
              if (r.status === 429) return { first429: i, before, other };
              if (r.status === expected) before += 1; else other += 1;
              await sleep(delayMs);
            }
            return { first429: 0, before, other };
          }

          try {
            browser = await chromium.launch({ headless: true });
            const context = await browser.newContext();
            const page = await context.newPage();
            let capturedToken = '';

            page.on('request', request => {
              try {
                if (request.method() === 'POST' && new URL(request.url()).pathname === '/api/security/session') {
                  const body = request.postDataJSON();
                  if (typeof body?.token === 'string' && body.token.length > 20) capturedToken = body.token;
                }
              } catch {}
            });

            await page.goto(TARGET, { waitUntil: 'domcontentloaded', timeout: 60000 });
            const ua = await page.evaluate(() => navigator.userAgent);

            let first;
            try {
              first = await Promise.race([
                page.evaluate(async () => {
                  const response = await fetch('/api/etf-flows');
                  return { status: response.status, text: await response.text() };
                }),
                new Promise((_, reject) => setTimeout(() => reject(new Error('browser_session_timeout')), 90000)),
              ]);
            } catch (error) {
              record('VALID_BROWSER_SESSION', 'NOT_PROVEN', String(error?.message || error));
            }

            const cookies = await context.cookies(TARGET);
            const session = cookies.find(cookie => cookie.name === '__Host-wa_session');
            if (first?.status === 200 && session?.value) {
              record('VALID_BROWSER_SESSION', 'PASS', 'protected_fetch=200 session_cookie_present');

              const replayControl = await direct('/api/etf-flows?qa=replay-control', ua, session.value);
              if (replayControl.status === 200) {
                record('SESSION_REPLAY_SAME_UA', 'PASS', 'http=200');
              } else {
                record('SESSION_REPLAY_SAME_UA', 'FAIL', `http=${replayControl.status}`);
              }

              const changed = await direct('/api/etf-flows?qa=changed-ua', `${ua} qa-changed`, session.value);
              if (changed.status === 401) {
                record('SESSION_REPLAY_CHANGED_UA', 'PASS', 'http=401');
              } else {
                record('SESSION_REPLAY_CHANGED_UA', 'FAIL', `http=${changed.status}`);
              }

              if (capturedToken) {
                const replayToken = await direct('/api/security/session', ua, '', {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({ token: capturedToken }),
                });
                if (replayToken.status === 403) {
                  record('VALID_TURNSTILE_REPLAY', 'PASS', 'http=403');
                } else {
                  record('VALID_TURNSTILE_REPLAY', 'FAIL', `http=${replayToken.status}`);
                }
              } else {
                record('VALID_TURNSTILE_REPLAY', 'NOT_PROVEN', 'token_not_observed_in_browser_exchange');
              }

              const invalidQuery = await direct('/api/etf-flows/history?detail=2&asset=BTC', ua, session.value);
              if (invalidQuery.status === 400) {
                record('INVALID_QUERY_AFTER_AUTH', 'PASS', 'http=400');
              } else {
                record('INVALID_QUERY_AFTER_AUTH', 'FAIL', `http=${invalidQuery.status}`);
              }

              const heavy = await rateLoop('/api/etf-flows/history?detail=2&asset=BTC', ua, session.value, 400, 100, 200);
              if (heavy.first429 > 0) {
                record('HEAVY_READ_RATE_LIMIT', 'PASS', `first_429=${heavy.first429} prelimit=${heavy.before} other=${heavy.other}`);
              } else {
                record('HEAVY_READ_RATE_LIMIT', 'FAIL', `no_429 prelimit=${heavy.before} other=${heavy.other}`);
              }

              await sleep(1500);
              const standard = await rateLoop('/api/etf-flows?qa=standard-limit', ua, session.value, 200, 240, 150);
              if (standard.first429 > 0) {
                record('STANDARD_READ_RATE_LIMIT', 'PASS', `first_429=${standard.first429} prelimit=${standard.before} other=${standard.other}`);
              } else {
                record('STANDARD_READ_RATE_LIMIT', 'FAIL', `no_429 prelimit=${standard.before} other=${standard.other}`);
              }
            } else if (first) {
              record('VALID_BROWSER_SESSION', 'NOT_PROVEN', `protected_fetch_http=${first.status} cookie=${Boolean(session)}`);
            }
          } catch (error) {
            record('BROWSER_PROBE_RUNTIME', 'FAIL', String(error?.message || error));
          } finally {
            if (browser) await browser.close().catch(() => {});
            const header = [
              `target=${TARGET}`,
              `timestamp_utc=${new Date().toISOString()}`,
            ];
            fs.writeFileSync(OUT, [...header, ...rows, `FAIL=${failures}`].join('\n') + '\n');
          }

          process.exitCode = failures ? 1 : 0;
          NODE

          node browser-probe.mjs

      - name: Persist minimal browser evidence
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ ! -f security-preview-browser-result.txt ]]; then
            {
              echo 'target=https://704e00e8.wave-alpha.pages.dev'
              echo "timestamp_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
              echo 'BROWSER_PROBE_RUNTIME FAIL result_file_missing'
              echo 'FAIL=1'
            } > security-preview-browser-result.txt
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add security-preview-browser-result.txt
          if ! git diff --cached --quiet; then
            git commit -m 'qa: record security preview browser result'
            git push
          fi
          cat security-preview-browser-result.txt
          ! grep -Eq ' FAIL ' security-preview-browser-result.txt
