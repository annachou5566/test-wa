name: P0 Alpha Free Render Removal QA

on:
  push:
    branches:
      - chatgpt/qa-p0-alpha-free-render-removal-2026-09-08

permissions:
  contents: read

jobs:
  p0-public-source-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verify runner is public standard
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$RUNNER_OS" = "Linux"
          printf 'RUNNER_OS=%s\n' "$RUNNER_OS"

      - name: Fetch exact data-fetcher-king candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          git init /tmp/dfk
          git -C /tmp/dfk remote add origin https://github.com/annachou5566/data-fetcher-king.git
          git -C /tmp/dfk fetch --depth=1 origin 0fa4f18e5480c93d9fc2877db9aa42cd77a328b9
          git -C /tmp/dfk checkout --detach FETCH_HEAD
          test "$(git -C /tmp/dfk rev-parse HEAD)" = "0fa4f18e5480c93d9fc2877db9aa42cd77a328b9"

      - name: Compile Python candidates
        shell: bash
        run: |
          set -Eeuo pipefail
          cd /tmp/dfk
          python3 -m py_compile             scripts/fetch_alpha.py             scripts/fetch_base_data.py             scripts/fetch_competition.py             scripts/sync_listing_prices.py
          printf 'DFK_PY_COMPILE=PASS\n'

      - name: Verify Render-free workflow contract
        shell: bash
        run: |
          set -Eeuo pipefail
          cd /tmp/dfk
          python3 - <<'PY'
          from pathlib import Path

          workflows = [
              ".github/workflows/update_data.yml",
              ".github/workflows/update_tails.yml",
              ".github/workflows/fetch_base_data.yml",
              ".github/workflows/update_competition.yml",
              ".github/workflows/sync_listing_prices.yml",
          ]
          forbidden = ("PROXY_WORKER_URL", "RENDER_API_KEY", "onrender.com")
          for path in workflows:
              text = Path(path).read_text(encoding="utf-8")
              for needle in forbidden:
                  if needle in text:
                      raise SystemExit(f"{path}: forbidden active dependency {needle}")

          for path in (
              "scripts/fetch_alpha.py",
              "scripts/fetch_base_data.py",
              "scripts/fetch_competition.py",
          ):
              text = Path(path).read_text(encoding="utf-8")
              for needle in ("PROXY_WORKER_URL", "RENDER_API_KEY", "onrender.com"):
                  if needle in text:
                      raise SystemExit(f"{path}: forbidden runtime dependency {needle}")

          fetch_alpha = Path("scripts/fetch_alpha.py").read_text(encoding="utf-8")
          required = (
              '"schema_version": 2',
              '"boundary_date": yesterday_str',
              '"complete": True',
              'Tail coverage incomplete; không publish artifact.',
              'Tail cohort có duplicate alphaId; không publish artifact.',
              'Tail cohort thiếu contract/chainId',
              'Tail series shape invalid; không publish artifact.',
              'covered_limit_ids = set(tails_limit)',
              'head_object(Bucket=R2_BUCKET_NAME, Key=\'tails_cache.json\')',
          )
          for needle in required:
              if needle not in fetch_alpha:
                  raise SystemExit(f"fetch_alpha.py missing contract: {needle}")

          print("DFK_RENDER_FREE_STATIC=PASS")
          PY

      - name: Fetch exact alpha-realtime-bot candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          git init /tmp/alpha
          git -C /tmp/alpha remote add origin https://github.com/annachou5566/alpha-realtime-bot.git
          git -C /tmp/alpha fetch --depth=1 origin 12437b70ad07d1019af70cf6c0ac0ba123b5bdce
          git -C /tmp/alpha checkout --detach FETCH_HEAD
          test "$(git -C /tmp/alpha rev-parse HEAD)" = "12437b70ad07d1019af70cf6c0ac0ba123b5bdce"

      - name: Install exact backend dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          cd /tmp/alpha
          npm ci --ignore-scripts --no-audit --no-fund

      - name: Run backend source and contract tests
        shell: bash
        run: |
          set -Eeuo pipefail
          cd /tmp/alpha
          npm test
          test ! -e .github/workflows/production-rollout.yml
          printf 'ALPHA_BACKEND_TESTS=PASS\n'
          printf 'RENDER_ROLLOUT_RETIRED=PASS\n'
