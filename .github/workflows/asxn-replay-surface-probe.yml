name: ASXN replay-surface capability probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/asxn-replay-surface-probe.yml"
      - "scripts/asxn_replay_surface_probe.py"

permissions:
  contents: read

concurrency:
  group: asxn-replay-surface-capability-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install bounded public-probe dependencies
        run: python -m pip install --disable-pip-version-check playwright psutil

      - name: Static compile
        run: python -m py_compile scripts/asxn_stage3a_canary.py scripts/asxn_replay_surface_probe.py

      - name: Run bounded replay-surface capability probe
        run: python scripts/asxn_replay_surface_probe.py

      - name: Upload sanitized capability evidence
        if: always() && hashFiles('artifacts/asxn-replay-surface/summary.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: asxn-replay-surface-${{ github.run_id }}
          path: artifacts/asxn-replay-surface/summary.json
          retention-days: 3
          if-no-files-found: error
