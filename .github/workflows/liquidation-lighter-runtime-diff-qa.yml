name: Liquidation Lighter runtime diff QA

on:
  push:
    paths:
      - "scripts/liquidation-lighter-runtime-diff-qa.mjs"
      - ".github/workflows/liquidation-lighter-runtime-diff-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: liquidation-lighter-runtime-diff-qa
  cancel-in-progress: true

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Playwright
        run: npm install --no-save playwright@1.55.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Compare accepted Preview and Production Lighter context
        run: node scripts/liquidation-lighter-runtime-diff-qa.mjs
