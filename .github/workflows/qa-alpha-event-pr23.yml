name: QA Alpha Event Claim Peak Spot Fallback
on:
  push:
    branches:
      - qa-alpha-event-pr23-20261013
permissions:
  contents: read
jobs:
  event-price-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact public producer candidate
        uses: actions/checkout@v4
        with:
          repository: annachou5566/data-fetcher-king
          ref: 917ae3a6e5edb138052babfbbd94a6bcf8533c37
          persist-credentials: false
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimum imports
        run: python -m pip install --disable-pip-version-check requests python-dotenv cloudscraper boto3
      - name: Compile source and run nine mocked tests without provider credentials
        working-directory: scripts
        run: |
          python -m py_compile sync_listing_prices.py test_alpha_event_claim_peak.py
          python -m unittest -v test_alpha_event_claim_peak.py
