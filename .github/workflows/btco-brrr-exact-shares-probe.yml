name: BTCO BRRR exact shares probe

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Playwright package only
        run: python -m pip install --disable-pip-version-check playwright==1.62.0
      - name: Run bounded first-party network discovery
        run: python scripts/btco_brrr_exact_shares_probe.py
      - name: Upload public evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btco-brrr-exact-shares-artifacts
          path: artifacts/btco-brrr-exact-shares
          if-no-files-found: error
          retention-days: 3
