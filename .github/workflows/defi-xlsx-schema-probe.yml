name: DEFI XLSX schema probe

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/defi_xlsx_schema_probe.py'
      - '.github/workflows/defi-xlsx-schema-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect public first-party DEFI XLSX schema
        run: python scripts/defi_xlsx_schema_probe.py
      - name: Upload one-shot evidence
        uses: actions/upload-artifact@v4
        with:
          name: defi-xlsx-schema
          path: artifacts/defi-xlsx-schema/
          retention-days: 1
          if-no-files-found: error
