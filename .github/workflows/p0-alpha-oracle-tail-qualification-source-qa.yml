name: P0 Alpha Oracle Tail Qualification Source QA

on:
  push:
    branches:
      - chatgpt/qa-p0-alpha-free-render-removal-2026-09-08

permissions:
  contents: read

jobs:
  source-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Fetch exact alpha candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          git init /tmp/alpha
          git -C /tmp/alpha remote add origin https://github.com/annachou5566/alpha-realtime-bot.git
          git -C /tmp/alpha fetch --depth=1 origin 315298199086c4397526957d87e8b2bec2ed3934
          git -C /tmp/alpha checkout --detach FETCH_HEAD
          test "$(git -C /tmp/alpha rev-parse HEAD)" = "315298199086c4397526957d87e8b2bec2ed3934"

      - name: Syntax qualification source
        shell: bash
        run: |
          set -Eeuo pipefail
          cd /tmp/alpha
          node --check lib/tails-producer.js
          node --check scripts/tails-resource-qualification.js
          bash -n scripts/oracle-p0-tails-resource-qualification.sh
          printf 'TAILS_QUAL_SOURCE_SYNTAX=PASS\n'

      - name: Verify dependency manifests unchanged from deployed source
        shell: bash
        run: |
          set -Eeuo pipefail
          git -C /tmp/alpha fetch --depth=1 origin 4a83777645c6de29c69cc3c2351b928bb0236f65
          test -z "$(git -C /tmp/alpha diff --name-only 4a83777645c6de29c69cc3c2351b928bb0236f65..315298199086c4397526957d87e8b2bec2ed3934 -- package.json package-lock.json)"
          printf 'DEPENDENCY_REUSE_GATE=PASS\n'

      - name: Install exact dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          cd /tmp/alpha
          npm ci --ignore-scripts --no-audit --no-fund

      - name: Run full backend tests
        shell: bash
        run: |
          set -Eeuo pipefail
          cd /tmp/alpha
          npm test
          printf 'ALPHA_BACKEND_TESTS=PASS\n'
