name: ASXN History aggregate qualification

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/asxn-history-aggregate-qualification.yml"
      - "scripts/asxn_history_aggregate_qualification.py"

permissions:
  contents: read

concurrency:
  group: asxn-history-aggregate-qualification
  cancel-in-progress: false

jobs:
  q1:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install bounded public-probe dependencies
        run: python -m pip install --disable-pip-version-check playwright psutil
      - name: Static compile
        run: python -m py_compile scripts/asxn_history_aggregate_qualification.py
      - name: Run Q1 aggregate qualification
        run: python scripts/asxn_history_aggregate_qualification.py
      - name: Upload sanitized Q1 evidence
        if: always() && hashFiles('artifacts/asxn-history-aggregate/summary.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: asxn-history-aggregate-q1-${{ github.run_id }}
          path: artifacts/asxn-history-aggregate/summary.json
          retention-days: 3
          if-no-files-found: error
