name: Lighter source probe

on:
  pull_request:
    paths:
      - 'scripts/lighter_internal_deleverage_probe.py'
      - '.github/workflows/lighter-source-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Probe official Lighter INTERNAL_DELEVERAGE transaction surface
        run: python3 scripts/lighter_internal_deleverage_probe.py
