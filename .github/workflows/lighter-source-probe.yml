name: Lighter source probe

on:
  pull_request:
    paths:
      - 'scripts/lighter_ws_trade_probe.mjs'
      - '.github/workflows/lighter-source-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Soak official Lighter all-perp trade websocket
        run: node scripts/lighter_ws_trade_probe.mjs
