name: Lighter source probe

on:
  pull_request:
    paths:
      - 'scripts/lighter_source_probe.py'
      - '.github/workflows/lighter-source-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Probe official public Lighter transaction API
        run: python3 scripts/lighter_source_probe.py
