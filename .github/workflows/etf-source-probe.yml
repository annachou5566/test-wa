name: ETF source probe

on:
  push:
    branches: [main]
    paths:
      - etf_source_probe.py
      - .github/workflows/etf-source-probe.yml

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests openpyxl
      - run: python etf_source_probe.py
