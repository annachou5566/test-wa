name: ETF.com OBTC DEFI history probe

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright package only
        run: python -m pip install --disable-pip-version-check playwright==1.62.0
      - name: Probe ETF.com daily fund-flow history
        run: python scripts/etfcom_obtc_defi_history_probe.py
      - name: Upload public evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: etfcom-obtc-defi-history
          path: artifacts/etfcom-obtc-defi-history
          if-no-files-found: error
          retention-days: 3
