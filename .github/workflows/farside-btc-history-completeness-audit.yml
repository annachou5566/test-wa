name: Farside BTC history completeness audit

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright package only
        run: python -m pip install --disable-pip-version-check playwright==1.62.0
      - name: Audit exact public Farside BTC history table with ordinary system Chrome
        run: python scripts/farside_btc_history_completeness_audit.py
      - name: Upload public evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: farside-btc-history-completeness
          path: artifacts/farside-btc-history-completeness
          if-no-files-found: error
          retention-days: 3
