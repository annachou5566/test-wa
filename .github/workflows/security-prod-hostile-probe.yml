name: Security Production hostile probe

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/security_prod_hostile_probe.py"
      - ".github/workflows/security-prod-hostile-probe.yml"

permissions:
  contents: read

jobs:
  hostile:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install bounded probe dependencies
        run: python -m pip install --disable-pip-version-check requests playwright

      - name: Run non-destructive Production hostile probe
        run: python scripts/security_prod_hostile_probe.py

      - name: Upload sanitized evidence
        if: always() && hashFiles('artifacts/security-prod-hostile/summary.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: security-prod-hostile-${{ github.run_id }}
          path: artifacts/security-prod-hostile/summary.json
          retention-days: 3
          if-no-files-found: error
