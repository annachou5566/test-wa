name: P0 Short Page Pagination QA

on:
  push:
    branches:
      - chatgpt/qa-p0-alpha-free-render-removal-2026-09-08

permissions:
  contents: read

jobs:
  source-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Fetch exact sources
        shell: bash
        run: |
          set -Eeuo pipefail

          git init /tmp/alpha
          git -C /tmp/alpha remote add origin https://github.com/annachou5566/alpha-realtime-bot.git
          git -C /tmp/alpha fetch --depth=1 origin 64a26c80ffdb8941dad085d401814ec5435998e9
          git -C /tmp/alpha checkout --detach FETCH_HEAD
          test "$(git -C /tmp/alpha rev-parse HEAD)" = "64a26c80ffdb8941dad085d401814ec5435998e9"
          printf 'ALPHA_EXACT_HEAD=PASS\n'

          git init /tmp/dfk
          git -C /tmp/dfk remote add origin https://github.com/annachou5566/data-fetcher-king.git
          git -C /tmp/dfk fetch --depth=1 origin d02582718b7cedd01fd610127663895bed1f7d43
          git -C /tmp/dfk checkout --detach FETCH_HEAD
          test "$(git -C /tmp/dfk rev-parse HEAD)" = "d02582718b7cedd01fd610127663895bed1f7d43"
          printf 'DFK_EXACT_HEAD=PASS\n'

      - name: Static pagination gates
        shell: bash
        run: |
          set -Eeuo pipefail

          cd /tmp/alpha
          node --check lib/tails-producer.js
          grep -q 'rows.length < 1000' lib/tails-producer.js
          grep -q 'newly-listed short kline page stops pagination' test/tails-producer.test.js
          printf 'ALPHA_SHORT_PAGE_STATIC=PASS\n'

          cd /tmp/dfk
          python3 -m py_compile scripts/fetch_alpha.py
          grep -q 'len(rows) < 1000' scripts/fetch_alpha.py
          printf 'DFK_SHORT_PAGE_STATIC=PASS\n'

      - name: Install alpha dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          cd /tmp/alpha
          npm ci --ignore-scripts --no-audit --no-fund

      - name: Run alpha tests
        shell: bash
        run: |
          set -Eeuo pipefail
          cd /tmp/alpha
          npm test
          printf 'ALPHA_BACKEND_TESTS=PASS\n'
