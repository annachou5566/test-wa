name: ETF final source probe

on:
  pull_request:
    branches: [main]
    paths:
      - etf_final_source_probe.py
      - .github/workflows/etf-final-source-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests openpyxl
      - run: python etf_final_source_probe.py
