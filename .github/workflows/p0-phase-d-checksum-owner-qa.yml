name: P0 Phase D Checksum Owner QA

on:
  push:
    branches:
      - chatgpt/qa-p0-alpha-free-render-removal-2026-09-08

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch exact Alpha candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          git init /tmp/alpha
          git -C /tmp/alpha remote add origin https://github.com/annachou5566/alpha-realtime-bot.git
          git -C /tmp/alpha fetch --depth=1 origin e560eb40b0fac0b2cbcd288aebc5ce97b5f5113c
          git -C /tmp/alpha checkout --detach FETCH_HEAD
          test "$(git -C /tmp/alpha rev-parse HEAD)" = "e560eb40b0fac0b2cbcd288aebc5ce97b5f5113c"
          printf 'ALPHA_EXACT_HEAD=PASS\n'

      - name: Wrapper checksum-owner static gate
        shell: bash
        run: |
          set -Eeuo pipefail
          cd /tmp/alpha
          bash -n scripts/oracle-p0-tails-candidate-artifact.sh
          grep -q "sudo -n -u wavealpha-alpha bash -lc" scripts/oracle-p0-tails-candidate-artifact.sh
          grep -q "sha256sum -c" scripts/oracle-p0-tails-candidate-artifact.sh
          printf 'CHECKSUM_OWNER_STATIC=PASS\n'
