name: ASXN History HIP3 scope probe

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/asxn-history-hip3-scope.yml"
      - "scripts/asxn_history_hip3_scope_probe.py"

permissions:
  contents: read

concurrency:
  group: asxn-history-hip3-scope
  cancel-in-progress: false

jobs:
  q1b:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install bounded public-probe dependencies
        run: python -m pip install --disable-pip-version-check playwright psutil
      - name: Static compile
        run: python -m py_compile scripts/asxn_history_aggregate_qualification.py scripts/asxn_history_hip3_scope_probe.py
      - name: Run HIP-3 scope probe
        run: python scripts/asxn_history_hip3_scope_probe.py
      - name: Upload sanitized evidence
        if: always() && hashFiles('artifacts/asxn-history-hip3-scope/summary.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: asxn-history-hip3-q1b-${{ github.run_id }}
          path: artifacts/asxn-history-hip3-scope/summary.json
          retention-days: 3
          if-no-files-found: error
