name: Security Preview Hostile Probe

on:
  push:
    paths:
      - '.github/workflows/security-preview-hostile.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hostile-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run bounded public hostile probes
        shell: bash
        run: |
          set -Eeuo pipefail
          TARGET='https://704e00e8.wave-alpha.pages.dev'
          TMP="$(mktemp -d)"
          trap 'rm -rf "$TMP"' EXIT
          PASS=0
          FAIL=0
          SUMMARY="$TMP/summary.txt"

          record() {
            local name="$1" status="$2" detail="$3"
            printf '%-34s %-5s %s\n' "$name" "$status" "$detail" | tee -a "$SUMMARY"
            if [[ "$status" == PASS ]]; then PASS=$((PASS+1)); else FAIL=$((FAIL+1)); fi
          }

          request() {
            local name="$1"; shift
            curl -sS --connect-timeout 10 --max-time 20 \
              -D "$TMP/$name.headers" -o "$TMP/$name.body" \
              -w '%{http_code}' "$@"
          }

          has_body() { grep -Fq "$2" "$TMP/$1.body"; }
          has_header() {
            tr -d '\r' < "$TMP/$1.headers" | grep -Eiq "^$2"
          }

          code="$(request anon "$TARGET/api/etf-flows")"
          if [[ "$code" == 403 ]] && has_body anon 'ACCESS_DENIED'; then
            record DIRECT_ANONYMOUS PASS "http=$code denied"
          else
            record DIRECT_ANONYMOUS FAIL "http=$code"
          fi

          code="$(request same_origin_no_cookie \
            -H "Origin: $TARGET" -H 'Sec-Fetch-Site: same-origin' \
            "$TARGET/api/etf-flows")"
          if [[ "$code" == 401 ]] && has_body same_origin_no_cookie 'SESSION_REQUIRED'; then
            record MISSING_COOKIE PASS "http=$code session_required"
          else
            record MISSING_COOKIE FAIL "http=$code"
          fi

          code="$(request malformed_cookie \
            -H "Origin: $TARGET" -H 'Sec-Fetch-Site: same-origin' \
            -H 'Cookie: __Host-wa_session=not-a-valid-session' \
            "$TARGET/api/etf-flows")"
          if [[ "$code" == 401 ]] && has_body malformed_cookie 'SESSION_REQUIRED'; then
            record MALFORMED_COOKIE PASS "http=$code session_required"
          else
            record MALFORMED_COOKIE FAIL "http=$code"
          fi

          code="$(request cross_origin \
            -H 'Origin: https://example.invalid' -H 'Sec-Fetch-Site: cross-site' \
            "$TARGET/api/etf-flows")"
          if [[ "$code" == 403 ]] && has_body cross_origin 'ACCESS_DENIED'; then
            record CROSS_ORIGIN PASS "http=$code denied"
          else
            record CROSS_ORIGIN FAIL "http=$code"
          fi

          code="$(request wrong_method \
            -X POST -H "Origin: $TARGET" -H 'Sec-Fetch-Site: same-origin' \
            "$TARGET/api/etf-flows")"
          if [[ "$code" == 405 ]] && has_header wrong_method 'allow: *GET'; then
            record WRONG_METHOD PASS "http=$code allow=GET"
          else
            record WRONG_METHOD FAIL "http=$code"
          fi

          code="$(request security_config \
            -H "Origin: $TARGET" -H 'Sec-Fetch-Site: same-origin' \
            "$TARGET/api/security/session")"
          config_ok=0
          if [[ "$code" == 200 ]]; then
            if python3 - "$TMP/security_config.body" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding='utf-8') as f:
              data = json.load(f)
          assert set(data) == {'sitekey', 'action'}
          assert isinstance(data['sitekey'], str) and data['sitekey']
          assert data['action'] == 'wave-session'
          PY
            then config_ok=1; fi
          fi
          if [[ "$config_ok" == 1 ]]; then
            record CONFIG_MIN_DISCLOSURE PASS "http=$code keys=sitekey,action"
          else
            record CONFIG_MIN_DISCLOSURE FAIL "http=$code"
          fi

          code="$(request oversized_session \
            -X POST -H "Origin: $TARGET" -H 'Sec-Fetch-Site: same-origin' \
            -H 'Content-Type: application/json' \
            --data-binary "$(python3 -c 'print("{\"token\":\"" + "x"*5000 + "\"}")')" \
            "$TARGET/api/security/session")"
          if [[ "$code" == 400 ]] && has_body oversized_session 'BAD_REQUEST'; then
            record OVERSIZED_SESSION_BODY PASS "http=$code rejected_before_exchange"
          else
            record OVERSIZED_SESSION_BODY FAIL "http=$code"
          fi

          code="$(request invalid_turnstile \
            -X POST -H "Origin: $TARGET" -H 'Sec-Fetch-Site: same-origin' \
            -H 'Content-Type: application/json' --data '{"token":"invalid"}' \
            "$TARGET/api/security/session")"
          if [[ "$code" == 403 ]] && has_body invalid_turnstile 'ACCESS_DENIED'; then
            record INVALID_TURNSTILE PASS "http=$code denied"
          else
            record INVALID_TURNSTILE FAIL "http=$code"
          fi

          header_ok=1
          has_header same_origin_no_cookie 'cache-control: .*private.*no-store' || header_ok=0
          has_header same_origin_no_cookie 'cross-origin-resource-policy: *same-origin' || header_ok=0
          has_header same_origin_no_cookie 'x-content-type-options: *nosniff' || header_ok=0
          has_header same_origin_no_cookie 'x-frame-options: *DENY' || header_ok=0
          has_header same_origin_no_cookie 'referrer-policy: *no-referrer' || header_ok=0
          has_header same_origin_no_cookie 'x-robots-tag: .*noindex' || header_ok=0
          if [[ "$header_ok" == 1 ]]; then
            record PROTECTED_HEADERS PASS "private/no-store + CORP + nosniff + frame/referrer/robots"
          else
            record PROTECTED_HEADERS FAIL "one_or_more_headers_missing"
          fi

          proxy_url="https://r.jina.ai/https://704e00e8.wave-alpha.pages.dev/api/etf-flows"
          proxy_code="$(curl -sS --connect-timeout 10 --max-time 30 -o "$TMP/proxy.body" -w '%{http_code}' "$proxy_url" || true)"
          if ! grep -Eq '"(etfs|totals|history|fetched_at)"[[:space:]]*:' "$TMP/proxy.body" 2>/dev/null; then
            record PROXY_TEXT_READER PASS "proxy_http=${proxy_code:-curl_error} proprietary_json_absent"
          else
            record PROXY_TEXT_READER FAIL "proxy_http=${proxy_code:-curl_error} proprietary_json_detected"
          fi

          seen_429=0
          count_403=0
          for i in $(seq 1 16); do
            code="$(curl -sS --connect-timeout 10 --max-time 20 -o "$TMP/limit_$i.body" -w '%{http_code}' \
              -X POST -H "Origin: $TARGET" -H 'Sec-Fetch-Site: same-origin' \
              -H 'User-Agent: wave-security-hostile-probe/1' \
              -H 'Content-Type: application/json' --data '{"token":"invalid"}' \
              "$TARGET/api/security/session")"
            [[ "$code" == 403 ]] && count_403=$((count_403+1))
            if [[ "$code" == 429 ]]; then seen_429=1; break; fi
          done
          if [[ "$seen_429" == 1 ]]; then
            record SESSION_MINT_RATE_LIMIT PASS "403_before_limit=$count_403 then_429=yes"
          else
            record SESSION_MINT_RATE_LIMIT FAIL "no_429_within_16_attempts"
          fi

          {
            echo '## Wave Security Preview hostile probe'
            echo
            echo '```text'
            cat "$SUMMARY"
            echo '```'
            echo
            echo "PASS=$PASS FAIL=$FAIL"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "SECURITY_PREVIEW_PUBLIC_PROBE_PASS=$PASS"
          echo "SECURITY_PREVIEW_PUBLIC_PROBE_FAIL=$FAIL"
          [[ "$FAIL" == 0 ]]
