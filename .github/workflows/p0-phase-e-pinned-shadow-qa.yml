name: P0 Phase E Pinned Shadow QA

on:
  push:
    branches:
      - chatgpt/qa-p0-alpha-free-render-removal-2026-09-08

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Fetch exact Alpha candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          git init /tmp/alpha
          git -C /tmp/alpha remote add origin https://github.com/annachou5566/alpha-realtime-bot.git
          git -C /tmp/alpha fetch --depth=1 origin 2df2f5a5409ccb6a7327f7c967c80472b11eddd2
          git -C /tmp/alpha checkout --detach FETCH_HEAD
          test "$(git -C /tmp/alpha rev-parse HEAD)" = "2df2f5a5409ccb6a7327f7c967c80472b11eddd2"
          printf 'ALPHA_EXACT_HEAD=PASS\n'

      - name: Static pinned-shadow gates
        shell: bash
        run: |
          set -Eeuo pipefail
          cd /tmp/alpha
          node --check index.js
          node --check lib/tails-cache-contract.js
          grep -q 'validateTailsHeadForSource' index.js
          grep -q 'TAILS_CACHE_EXPECTED_SHA256' index.js
          grep -q "key === 'tails_cache.json'" lib/tails-cache-contract.js
          grep -q 'pinned-payload-hash-required' lib/tails-cache-contract.js
          grep -q 'pinned-payload-hash-mismatch' lib/tails-cache-contract.js
          grep -q "sourceMode: 'pinned-shadow'" lib/tails-cache-contract.js
          printf 'PINNED_SHADOW_STATIC=PASS\n'

      - name: Install exact dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          cd /tmp/alpha
          npm ci --ignore-scripts --no-audit --no-fund

      - name: Run full Alpha tests
        shell: bash
        run: |
          set -Eeuo pipefail
          cd /tmp/alpha
          npm test
          printf 'ALPHA_BACKEND_TESTS=PASS\n'
