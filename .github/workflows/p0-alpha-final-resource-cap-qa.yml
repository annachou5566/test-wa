name: P0 Alpha Final Resource Cap QA

on:
  push:
    branches:
      - chatgpt/qa-p0-alpha-free-render-removal-2026-09-08

permissions:
  contents: read

jobs:
  source-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Fetch exact alpha candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          git init /tmp/alpha
          git -C /tmp/alpha remote add origin https://github.com/annachou5566/alpha-realtime-bot.git
          git -C /tmp/alpha fetch --depth=1 origin c3d8718967914d78cacf20313e22ca5061b78804
          git -C /tmp/alpha checkout --detach FETCH_HEAD
          test "$(git -C /tmp/alpha rev-parse HEAD)" = "c3d8718967914d78cacf20313e22ca5061b78804"
          printf 'EXACT_HEAD=PASS\n'

      - name: Static safety envelope
        shell: bash
        run: |
          set -Eeuo pipefail
          cd /tmp/alpha
          node --check scripts/tails-resource-qualification.js
          bash -n scripts/oracle-p0-tails-resource-qualification.sh
          grep -q "TAILS_QUAL_MAX_REQUESTS', 320, 40, 2000" scripts/tails-resource-qualification.js
          grep -q "qualification_source=binance_first_party_only" scripts/oracle-p0-tails-resource-qualification.sh
          ! grep -q 'R2_READ_ONLY_ACCESS_KEY_ID' scripts/oracle-p0-tails-resource-qualification.sh
          printf 'RESOURCE_CAP_STATIC=PASS\n'

      - name: Install exact dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          cd /tmp/alpha
          npm ci --ignore-scripts --no-audit --no-fund

      - name: Full backend tests
        shell: bash
        run: |
          set -Eeuo pipefail
          cd /tmp/alpha
          npm test
          printf 'ALPHA_BACKEND_TESTS=PASS\n'
