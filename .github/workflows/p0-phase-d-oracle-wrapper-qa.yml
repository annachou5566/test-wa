name: P0 Phase D Oracle Wrapper QA

on:
  push:
    branches:
      - chatgpt/qa-p0-alpha-free-render-removal-2026-09-08

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Fetch exact Alpha candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          git init /tmp/alpha
          git -C /tmp/alpha remote add origin https://github.com/annachou5566/alpha-realtime-bot.git
          git -C /tmp/alpha fetch --depth=1 origin d253b6d25b3322dd14e5a0a586724a9b225a58cd
          git -C /tmp/alpha checkout --detach FETCH_HEAD
          test "$(git -C /tmp/alpha rev-parse HEAD)" = "d253b6d25b3322dd14e5a0a586724a9b225a58cd"
          printf 'ALPHA_EXACT_HEAD=PASS\n'

      - name: Wrapper static gates
        shell: bash
        run: |
          set -Eeuo pipefail
          cd /tmp/alpha
          bash -n scripts/oracle-p0-tails-candidate-artifact.sh
          node --check scripts/tails-candidate-artifact.js
          ! grep -Eq 'R2_ACCESS_KEY|R2_SECRET|R2_ENDPOINT|R2_BUCKET|PutObjectCommand|S3Client' scripts/oracle-p0-tails-candidate-artifact.sh
          grep -q 'CREDENTIAL_GATE=NOT_REQUIRED' scripts/oracle-p0-tails-candidate-artifact.sh
          grep -q 'R2_WRITE_PERFORMED=NO' scripts/oracle-p0-tails-candidate-artifact.sh
          grep -q 'VM.Standard.E2.1.Micro' scripts/oracle-p0-tails-candidate-artifact.sh
          grep -q 'CANDIDATE_GATE=PASS' scripts/oracle-p0-tails-candidate-artifact.sh
          printf 'ORACLE_CANDIDATE_WRAPPER_STATIC=PASS\n'

      - name: Install exact dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          cd /tmp/alpha
          npm ci --ignore-scripts --no-audit --no-fund

      - name: Run full Alpha tests
        shell: bash
        run: |
          set -Eeuo pipefail
          cd /tmp/alpha
          npm test
          printf 'ALPHA_BACKEND_TESTS=PASS\n'
